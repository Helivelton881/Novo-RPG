name: Testes

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # Unit: sem banco. Testes que dependem de Supabase aparecem como SKIPPED
  # aqui (e o resumo diz isso) -- eles so contam no job de integracao.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Verificar sintaxe do servidor
        run: node -c server.js

      - name: Verificar whitespace do diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            git diff --check HEAD~1 HEAD
          fi

      - name: Testes unitários
        run: npm run test:unit

  # Integração: EXIGE o Supabase de CI (projeto "Novo-RPG CI",
  # crtyqlwrsvesbtqglipp). Sem os secrets, ou apontando pra qualquer outro
  # projeto (inclusive producao), o job FALHA -- nunca "SKIP + verde".
  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    # O banco de CI e compartilhado: uma execucao por vez.
    concurrency:
      group: supabase-ci-integration
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Testes de integração (Supabase CI obrigatório)
        run: npm run test:integration
