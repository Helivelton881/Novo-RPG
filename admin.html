<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Novo RPG</title>
<style>
  :root{--bg:#12151c;--panel:#1b2029;--panel2:#232a36;--border:#2e3644;--text:#e8ecf1;--muted:#8b96a8;--accent:#5b8cff;--danger:#ff5a5a;--ok:#4ade80;--warn:#facc15}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #login{max-width:340px;margin:14vh auto;padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
  #login h1{font-size:18px;margin:0 0 16px}
  #login input{width:100%;padding:10px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)}
  #login button,.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:13px}
  .btn.danger{background:var(--danger)}
  .btn.ok{background:var(--ok);color:#0a1a0f}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  #err{color:var(--danger);font-size:13px;min-height:18px}
  #app{display:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0}
  header .who{color:var(--muted);font-size:12px}
  nav{display:flex;gap:4px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button.on{background:var(--panel2);color:var(--text);border-color:var(--border)}
  main{padding:20px;max-width:1100px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
  .card .n{font-size:24px;font-weight:700}
  .card .l{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:600;background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.ban{background:#3a1a1a;color:var(--danger)}
  .pill.mute{background:#3a3315;color:var(--warn)}
  .pill.on{background:#153a20;color:var(--ok)}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .row input{padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)}
  select{padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--border);padding:10px 16px;border-radius:8px;display:none;font-size:13px}
  .muted{color:var(--muted)}
  .noperm{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="login">
  <h1>Painel Admin</h1>
  <input id="u" placeholder="Usuário" autocomplete="username">
  <input id="p" type="password" placeholder="Senha" autocomplete="current-password">
  <button onclick="doLogin()">Entrar</button>
  <div id="err"></div>
</div>

<div id="app">
  <header>
    <h1>Painel Admin — Novo RPG</h1>
    <div class="who"><span id="whoName"></span> · <span id="whoRole"></span> · <a href="#" onclick="doLogout();return false" style="color:var(--muted)">sair</a></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// Fase 5.14: painel admin isolado do jogo (index.html) -- reusa o MESMO
// login/token de sessao (/api/auth/login), nunca um cargo guardado em
// localStorage: toda tela busca o estado real do servidor a cada acao.
let TOKEN = null, ME = null, TAB = 'dashboard';

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',3000)}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || ('Erro ' + res.status));
  return data;
}

async function doLogin(){
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await api('/api/auth/login', {method:'POST', body:JSON.stringify({username,password})});
    TOKEN = r.token;
    const me = await api('/api/admin/me');
    ME = me.admin;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('whoName').textContent = ME.username;
    document.getElementById('whoRole').textContent = ME.role;
    renderNav();
    openTab('dashboard');
  } catch (e) {
    err.textContent = e.message.includes('restrito') ? 'Esta conta não tem cargo administrativo.' : e.message;
  }
}
function doLogout(){ TOKEN=null; ME=null; document.getElementById('app').style.display='none'; document.getElementById('login').style.display='block'; }

const TABS = [
  {id:'dashboard', label:'Painel', perm:'view_dashboard'},
  {id:'players', label:'Jogadores', perm:'search_players'},
  {id:'economy', label:'Economia', perm:'view_economy'},
  {id:'guilds', label:'Guildas', perm:'view_guilds'},
  {id:'events', label:'Eventos', perm:'view_events'},
  {id:'roles', label:'Cargos', perm:'manage_roles'},
  {id:'audit', label:'Auditoria', perm:'view_security_log'},
];
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.filter(t => (ME.permissions||[]).includes(t.perm)).map(t =>
    `<button data-tab="${t.id}" class="${t.id===TAB?'on':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => openTab(b.dataset.tab));
}
async function openTab(id){
  TAB = id;
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '<p class="muted">Carregando...</p>';
  try {
    if (id === 'dashboard') return renderDashboard(main);
    if (id === 'players') return renderPlayers(main);
    if (id === 'economy') return renderEconomy(main);
    if (id === 'guilds') return renderGuilds(main);
    if (id === 'events') return renderEvents(main);
    if (id === 'roles') return renderRoles(main);
    if (id === 'audit') return renderAudit(main);
  } catch (e) {
    main.innerHTML = '<div class="noperm">' + e.message + '</div>';
  }
}

async function renderDashboard(main){
  const d = await api('/api/admin/dashboard');
  main.innerHTML = `
    <div class="cards">
      <div class="card"><div class="n">${d.online}</div><div class="l">Online agora (humanos)</div></div>
      <div class="card"><div class="n">${d.bansOpen}</div><div class="l">Banimentos ativos</div></div>
      <div class="card"><div class="n">${d.mutesOpen}</div><div class="l">Mutes ativos</div></div>
    </div>
    <h3>Atividade recente</h3>
    <table><thead><tr><th>Ação</th><th>Motivo</th><th>Quando</th></tr></thead><tbody>
    ${d.recentAudit.map(a => `<tr><td>${a.action}</td><td class="muted">${a.reason||'—'}</td><td class="muted">${new Date(a.created_at).toLocaleString('pt-BR')}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Nenhuma ação registrada ainda.</td></tr>'}
    </tbody></table>`;
}

async function renderPlayers(main){
  main.innerHTML = `<div class="row"><input id="pq" placeholder="Buscar por nome de personagem (min. 2 letras)"><button class="btn" onclick="searchPlayers()">Buscar</button></div><div id="pResults"></div>`;
  document.getElementById('pq').addEventListener('keydown', e => { if (e.key==='Enter') searchPlayers(); });
}
async function searchPlayers(){
  const q = document.getElementById('pq').value.trim();
  const r = await api('/api/admin/players?q=' + encodeURIComponent(q));
  const canMod = (ME.permissions||[]).includes('ban');
  document.getElementById('pResults').innerHTML = `<table><thead><tr><th>Personagem</th><th>Conta</th><th>Classe/Nv</th><th>Status</th>${canMod?'<th>Ações</th>':''}</tr></thead><tbody>
  ${r.players.map(p => `<tr>
    <td>${p.name}</td><td class="muted">${p.username}</td><td class="muted">${p.cls} Lv${p.lvl}</td>
    <td>${p.online?'<span class="pill on">online</span>':''} ${p.banned?'<span class="pill ban">banido</span>':''} ${p.muted?'<span class="pill mute">mutado</span>':''}</td>
    ${canMod?`<td>
      ${p.banned?`<button class="btn ghost" onclick="doUnban('${p.userId}')">Desbanir</button>`:`<button class="btn danger" onclick="doBan('${p.userId}')">Banir</button>`}
      ${p.muted?`<button class="btn ghost" onclick="doUnmute('${p.userId}')">Desmutar</button>`:`<button class="btn ghost" onclick="doMute('${p.userId}')">Mutar</button>`}
      <button class="btn ghost" onclick="doKick('${p.userId}')">Kick</button>
    </td>`:''}
  </tr>`).join('') || `<tr><td colspan="${canMod?5:4}" class="muted">Nenhum resultado.</td></tr>`}
  </tbody></table>`;
}
async function doKick(userId){ if(!confirm('Expulsar este jogador agora?'))return; await api('/api/admin/kick',{method:'POST',body:JSON.stringify({userId,reason:'Kick manual'})}); toast('Jogador expulso'); searchPlayers(); }
async function doBan(userId){ const reason=prompt('Motivo do banimento:'); if(!reason)return; await api('/api/admin/ban',{method:'POST',body:JSON.stringify({userId,reason})}); toast('Banido'); searchPlayers(); }
async function doUnban(userId){ if(!confirm('Remover o banimento?'))return; await api('/api/admin/unban',{method:'POST',body:JSON.stringify({userId})}); toast('Desbanido'); searchPlayers(); }
async function doMute(userId){ const reason=prompt('Motivo do mute:'); if(!reason)return; await api('/api/admin/mute',{method:'POST',body:JSON.stringify({userId,reason})}); toast('Mutado'); searchPlayers(); }
async function doUnmute(userId){ if(!confirm('Remover o mute?'))return; await api('/api/admin/unmute',{method:'POST',body:JSON.stringify({userId})}); toast('Desmutado'); searchPlayers(); }

async function renderEconomy(main){
  const e = await api('/api/admin/economy');
  main.innerHTML = `<p class="muted">Visão somente leitura — nenhuma ação corretiva disponível neste painel.</p>
  <div class="cards">
    <div class="card"><div class="n">${e.totalGold.toLocaleString('pt-BR')}</div><div class="l">Ouro em circulação</div></div>
    <div class="card"><div class="n">${e.totalGem.toLocaleString('pt-BR')}</div><div class="l">Gemas em circulação</div></div>
    <div class="card"><div class="n">${e.charactersCounted}</div><div class="l">Personagens contados</div></div>
    <div class="card"><div class="n">${e.activeListings}</div><div class="l">Anúncios ativos no mercado</div></div>
    <div class="card"><div class="n">${e.totalTransactions}</div><div class="l">Transações históricas</div></div>
  </div>`;
}
async function renderGuilds(main){
  const g = await api('/api/admin/guilds');
  main.innerHTML = `<table><thead><tr><th>Nome</th><th>Tag</th><th>Criada em</th></tr></thead><tbody>
  ${g.guilds.map(x=>`<tr><td>${x.name}</td><td class="muted">${x.tag}</td><td class="muted">${new Date(x.created_at).toLocaleString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Nenhuma guilda.</td></tr>'}
  </tbody></table>`;
}
async function renderEvents(main){
  const e = await api('/api/admin/events');
  main.innerHTML = `<table><thead><tr><th>Evento</th><th>Tipo</th><th>Início</th></tr></thead><tbody>
  ${e.upcoming.map(x=>`<tr><td>${x.label||x.type}</td><td class="muted">${x.type}</td><td class="muted">${new Date(x.startAt||Date.now()).toLocaleString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Nenhum evento agendado.</td></tr>'}
  </tbody></table>`;
}
async function renderRoles(main){
  const r = await api('/api/admin/roles');
  main.innerHTML = `<div class="row">
    <input id="rUser" placeholder="userId (uuid)">
    <select id="rRole"><option value="owner">owner</option><option value="admin">admin</option><option value="moderator" selected>moderator</option><option value="support">support</option></select>
    <button class="btn" onclick="grantRole()">Conceder</button>
  </div>
  <table><thead><tr><th>Conta</th><th>Cargo</th><th>Desde</th><th></th></tr></thead><tbody>
  ${r.roles.map(x=>`<tr><td>${x.username}</td><td class="muted">${x.role}</td><td class="muted">${new Date(x.grantedAt).toLocaleString('pt-BR')}</td><td><button class="btn ghost" onclick="revokeRole('${x.userId}')">Revogar</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhum cargo concedido ainda.</td></tr>'}
  </tbody></table>`;
}
async function grantRole(){
  const userId=document.getElementById('rUser').value.trim(), role=document.getElementById('rRole').value;
  if(!userId)return;
  await api('/api/admin/roles',{method:'POST',body:JSON.stringify({userId,role})});
  toast('Cargo concedido'); openTab('roles');
}
async function revokeRole(userId){ if(!confirm('Revogar o cargo desta conta?'))return; await api('/api/admin/roles/revoke',{method:'POST',body:JSON.stringify({userId})}); toast('Cargo revogado'); openTab('roles'); }

async function renderAudit(main){
  const a = await api('/api/admin/audit');
  main.innerHTML = `<table><thead><tr><th>Ação</th><th>Alvo</th><th>Motivo</th><th>Quando</th></tr></thead><tbody>
  ${a.audit.map(x=>`<tr><td>${x.action}</td><td class="muted">${x.target_user_id||x.target_character_id||'—'}</td><td class="muted">${x.reason||'—'}</td><td class="muted">${new Date(x.created_at).toLocaleString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Vazio.</td></tr>'}
  </tbody></table>`;
}
</script>
</body>
</html>
